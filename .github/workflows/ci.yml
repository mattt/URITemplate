name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    timeout-minutes: 5
    strategy:
      matrix:
        include:
          - swift-version: "6.0.3"
            runner: macos-15
            xcode: "16.2"
          - swift-version: "6.1.0"
            runner: macos-15
            xcode: "16.3"
          - swift-version: "6.4"
            runner: xcode-27
            xcode: "27.0"

    runs-on: ${{ matrix.runner }}
    name: Test (Swift ${{ matrix.swift-version }})
    env:
      DEVELOPER_DIR: /Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer

    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: xcrun --toolchain XcodeDefault swift build -v

      - name: Run tests
        run: xcrun --toolchain XcodeDefault swift test -v
